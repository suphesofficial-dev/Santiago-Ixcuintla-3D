<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SANTIAGO IXCUINTLA 3D [POR EMMANUEL😋]</title>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #030B1C; }
    #map {
      width: 100%;
      height: 100%;
      filter: contrast(1.06) saturate(1.15);
      transform: translateZ(0);
    }

    /* Viñeta cinematográfica sutil en los bordes */
    .vineta-cinematica {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      box-shadow: inset 0 0 95px rgba(2, 8, 23, 0.75);
    }

    /* Atmósfera cálida global en modo Medio Físico / Clima */
    .atmosfera-solar {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      background: radial-gradient(circle at 78% 16%, rgba(255, 223, 107, 0.48) 0%, rgba(255, 158, 0, 0.20) 38%, rgba(6, 26, 64, 0) 75%);
      opacity: 0;
      transition: opacity 0.8s ease;
      mix-blend-mode: screen;
      will-change: opacity;
      transform: translateZ(0);
    }
    .atmosfera-solar.activa { opacity: 1; }

    /* Sol 3D con corona y rayos volumétricos acelerados por GPU */
    .contenedor-sol {
      position: absolute;
      top: 6%;
      right: 14%;
      width: 280px;
      height: 280px;
      pointer-events: none;
      z-index: 6;
      display: none;
      align-items: center;
      justify-content: center;
      animation: entradaSol 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      will-change: transform, opacity;
      transform: translateZ(0);
    }

    @keyframes entradaSol {
      from { opacity: 0; transform: translate3d(0, -50px, 0) scale(0.5); }
      to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }

    .rayos-sol {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: repeating-conic-gradient(
        from 0deg,
        rgba(255, 235, 140, 0.45) 0deg 8deg,
        rgba(255, 235, 140, 0) 8deg 22deg
      );
      mask-image: radial-gradient(circle, black 22%, transparent 72%);
      -webkit-mask-image: radial-gradient(circle, black 22%, transparent 72%);
      animation: girarRayos 24s linear infinite;
      will-change: transform;
    }

    @keyframes girarRayos {
      from { transform: rotate(0deg) translateZ(0); }
      to { transform: rotate(360deg) translateZ(0); }
    }

    .esfera-sol {
      position: relative;
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #FFFFFF 0%, #FFF7C2 30%, #FFD166 65%, #F77F00 100%);
      box-shadow:
        0 0 40px 15px rgba(255, 243, 176, 0.98),
        0 0 95px 38px rgba(255, 209, 102, 0.85),
        0 0 170px 75px rgba(252, 163, 17, 0.55);
      animation: latidoSol 2.8s infinite alternate ease-in-out;
      will-change: transform;
    }

    @keyframes latidoSol {
      from { transform: scale(0.95) translateZ(0); }
      to { transform: scale(1.08) translateZ(0); }
    }

    /* Panel de control izquierdo estilo Glassmorphism optimizado */
    .panel-controles {
      position: absolute;
      top: 16px;
      left: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 285px;
      transform: translateZ(0);
    }

    .titulo-mapa {
      background: linear-gradient(135deg, rgba(6, 26, 64, 0.92), rgba(14, 48, 110, 0.92));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #FFD166;
      border: 2px solid #FFD166;
      border-radius: 14px;
      padding: 10px 12px;
      font-weight: 900;
      font-size: 13.5px;
      text-align: center;
      box-shadow: 0 0 25px rgba(255, 209, 102, 0.35), 0 10px 25px rgba(0,0,0,0.6);
      letter-spacing: 0.4px;
      text-shadow: 0 2px 10px rgba(255, 209, 102, 0.5);
    }

    .btn-capa {
      background: rgba(6, 22, 54, 0.86);
      color: #F8FAFC;
      border: 1.5px solid rgba(255, 209, 102, 0.65);
      border-radius: 11px;
      padding: 8px 13px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .btn-capa:hover {
      transform: translateX(5px);
      background: rgba(18, 52, 118, 0.95);
      border-color: #FFD166;
      box-shadow: 0 0 15px rgba(255, 209, 102, 0.45);
    }

    .btn-capa.activo {
      background: linear-gradient(135deg, #FFD166 0%, #FFB703 100%);
      color: #04122E;
      font-weight: 800;
      border-color: #FFF3B0;
      transform: translateX(6px);
      box-shadow: 0 0 24px rgba(255, 209, 102, 0.95);
    }

    /* Tarjeta de información Glassmorphism con fotografía */
    .tarjeta-info {
      position: absolute;
      bottom: 62px;
      left: 20px;
      z-index: 10;
      width: 415px;
      max-height: 325px;
      background: rgba(5, 19, 48, 0.90);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid #FFD166;
      border-radius: 18px;
      overflow-y: auto;
      color: #FFFFFF;
      box-shadow: 0 15px 40px rgba(0,0,0,0.8), 0 0 25px rgba(255, 209, 102, 0.25);
      display: none;
      animation: aparecer 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      transform: translateZ(0);
    }

    .tarjeta-info::-webkit-scrollbar { width: 6px; }
    .tarjeta-info::-webkit-scrollbar-track { background: rgba(6, 26, 64, 0.5); }
    .tarjeta-info::-webkit-scrollbar-thumb { background: #FFD166; border-radius: 4px; }

    @keyframes aparecer {
      from { opacity: 0; transform: translate3d(0, 20px, 0) scale(0.97); }
      to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }

    .foto-lugar {
      width: 100%;
      height: 115px;
      object-fit: cover;
      border-bottom: 2px solid #FFD166;
      display: block;
    }

    .contenido-tarjeta {
      padding: 13px 16px;
    }

    .tarjeta-info h3 {
      color: #FFD166;
      font-size: 15px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    .tarjeta-info ul {
      padding-left: 16px;
      font-size: 12px;
      line-height: 1.48;
    }

    .tarjeta-info li { margin-bottom: 6px; }
    .tarjeta-info b { color: #FFD166; }

    /* Ficha fija de coordenadas exactas abajo a la derecha */
    .ficha-ubicacion {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 10;
      background: rgba(5, 19, 48, 0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1.8px solid #FFD166;
      border-radius: 14px;
      padding: 11px 15px;
      color: #FFFFFF;
      font-size: 11.5px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      transform: translateZ(0);
    }

    .ficha-ubicacion strong {
      color: #FFD166;
      display: block;
      font-size: 12.5px;
      margin-bottom: 2px;
    }

    .ayuda-3d {
      position: absolute;
      top: 16px;
      right: 55px;
      z-index: 10;
      background: rgba(5, 19, 48, 0.86);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #FFD166;
      border: 1.5px solid rgba(255, 209, 102, 0.8);
      border-radius: 20px;
      padding: 7px 15px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 6px 20px rgba(0,0,0,0.45);
      transform: translateZ(0);
    }

    /* Botoncito enlace en esquina inferior izquierda */
    .btn-parar-3d {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 15;
      background: rgba(5, 19, 48, 0.90);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #FFD166;
      border: 1.8px solid #FFD166;
      border-radius: 11px;
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      display: inline-block;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.55), 0 0 12px rgba(255, 209, 102, 0.25);
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      transform: translateZ(0);
    }

    .btn-parar-3d:hover {
      background: #FFD166;
      color: #061A40;
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(255, 209, 102, 0.85);
    }

    /* Marcador pulsante 3D personalizado */
    .marcador-pulso {
      width: 22px;
      height: 22px;
      background: #FFD166;
      border: 3px solid #FFFFFF;
      border-radius: 50%;
      box-shadow: 0 0 18px #FFD166, 0 0 35px #F77F00;
      cursor: pointer;
      position: relative;
      will-change: transform;
    }
    .marcador-pulso::after {
      content: '';
      position: absolute;
      top: -9px;
      left: -9px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid #FFD166;
      animation: ondaRadar 2.2s infinite ease-out;
      will-change: transform, opacity;
    }
    @keyframes ondaRadar {
      0% { transform: scale(0.6) translateZ(0); opacity: 1; }
      100% { transform: scale(2.1) translateZ(0); opacity: 0; }
    }

    /* Estilo del Popup del marcador */
    .maplibregl-popup-content {
      background: rgba(5, 19, 48, 0.94) !important;
      color: #FFFFFF !important;
      border: 2px solid #FFD166 !important;
      border-radius: 12px !important;
      padding: 10px 14px !important;
      font-family: 'Poppins', sans-serif !important;
      font-size: 12px !important;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7) !important;
    }
    .maplibregl-popup-tip {
      border-top-color: #FFD166 !important;
    }
  </style>
</head>
<body>

  <div id="map"></div>
  <div class="vineta-cinematica"></div>
  <div id="atmosferaSolar" class="atmosfera-solar"></div>

  <div id="contenedorSol" class="contenedor-sol">
    <div class="rayos-sol"></div>
    <div class="esfera-sol"></div>
  </div>

  <div class="ayuda-3d">🖱️ Clic izq: Mover | Clic der / Ctrl: Girar 3D | Rueda: Zoom</div>

  <div class="panel-controles">
    <div class="titulo-mapa">SANTIAGO IXCUINTLA 3D [POR EMMANUEL😋]</div>
    <button class="btn-capa" id="btn-generales" onclick="activarModo('generales')">📍 1. Datos Generales</button>
    <button class="btn-capa" id="btn-fisico" onclick="activarModo('fisico')">☀️ 2. Medio Físico y Clima</button>
    <button class="btn-capa" id="btn-poblacion" onclick="activarModo('poblacion')">👥 3. Población y Sociedad</button>
    <button class="btn-capa" id="btn-economia" onclick="activarModo('economia')">🌾 4. Economía y Turismo</button>
    <button class="btn-capa" id="btn-cultura" onclick="activarModo('cultura')">🎭 5. Cultura e Historia</button>
    <button class="btn-capa" id="btn-reflexion" onclick="activarModo('reflexion')">💡 6. Identidad y Entorno</button>
    <button class="btn-capa" id="btn-reset" onclick="activarModo('reset')">🧭 Vista General 3D</button>
  </div>

  <div class="tarjeta-info" id="tarjetaInfo">
    <img id="infoFoto" class="foto-lugar" src="" alt="Santiago Ixcuintla, Nayarit">
    <div class="contenido-tarjeta">
      <h3 id="infoTitulo">Título</h3>
      <ul id="infoLista"></ul>
    </div>
  </div>

  <a class="btn-parar-3d" id="btnParar3D" href="https://www.canva.com/design/DAHa7jz3pkA/diW0IKNlvNGFHhswMglclg/edit" target="_blank" rel="noopener noreferrer">⏹ Parar simulación 3D</a>

  <div class="ficha-ubicacion">
    <strong>📍 Santiago Ixcuintla, Nayarit</strong>
    21°35'–22°05' N | 104°57'–105°36' O<br>
    Superficie: 1,723.7 km² • Altitud media: 18 m
  </div>

  <script>
    const CENTRO_SANTIAGO = [-105.2083, 21.8125];
    let animacionSolTimer = null;
    let mapaListo = false;

    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          'satelite': {
            type: 'raster',
            tiles: [
              'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
            ],
            tileSize: 256,
            attribution: 'Esri Satellite'
          },
          'etiquetas': {
            type: 'raster',
            tiles: [
              'https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'
            ],
            tileSize: 256
          },
          /* DEM optimizado a maxzoom 12: conserva todo el relieve 3D pero pesa 4x menos al volar */
          'terreno-dem': {
            type: 'raster-dem',
            tiles: [
              'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'
            ],
            encoding: 'terrarium',
            tileSize: 256,
            maxzoom: 12
          }
        },
        terrain: {
          source: 'terreno-dem',
          exaggeration: 2.4
        },
        sky: {
          'sky-color': '#0B397A',
          'sky-horizon-blend': 0.5,
          'horizon-color': '#7CC6FE',
          'horizon-fog-blend': 0.7,
          'fog-color': '#061A40',
          'fog-ground-blend': 0.4
        },
        layers: [
          { id: 'capa-satelite', type: 'raster', source: 'satelite' },
          {
            id: 'sombreado-relieve',
            type: 'hillshade',
            source: 'terreno-dem',
            paint: {
              'hillshade-exaggeration': 0.65,
              'hillshade-shadow-color': '#020817',
              'hillshade-highlight-color': '#FFF3B0',
              'hillshade-accent-color': '#FFD166'
            }
          },
          { id: 'capa-etiquetas', type: 'raster', source: 'etiquetas' }
        ]
      },
      center: CENTRO_SANTIAGO,
      zoom: 12.2,
      minZoom: 9.5,
      maxBounds: [[-105.80, 21.35], [-104.70, 22.25]],
      pitch: 64,
      bearing: -15,
      maxPitch: 85,
      fadeDuration: 0,
      maxTileCacheSize: 250,
      refreshExpiredTiles: false,
      antialias: false
    });

    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');

    const puntosInteres = [
      {
        coords: CENTRO_SANTIAGO,
        titulo: '📍 Santiago Ixcuintla (Cabecera)',
        desc: 'Corazón político y agrícola • Río Grande de Santiago',
        abierto: true
      },
      {
        coords: [-105.475, 21.905],
        titulo: '🏝️ Isla de Mexcaltitán',
        desc: 'Pueblo Mágico • Cuna mítica de Aztlán',
        abierto: false
      },
      {
        coords: [-105.495, 21.745],
        titulo: '🏖️ Playa Los Corchos',
        desc: 'Litoral del Pacífico • Pesca y turismo costero',
        abierto: false
      }
    ];

    puntosInteres.forEach(p => {
      const el = document.createElement('div');
      el.className = 'marcador-pulso';
      const popup = new maplibregl.Popup({ offset: 22, closeOnClick: false })
        .setHTML(`<b style="color:#FFD166; font-size:13px;">${p.titulo}</b><br>${p.desc}`);

      const marker = new maplibregl.Marker({ element: el })
        .setLngLat(p.coords)
        .setPopup(popup)
        .addTo(map);

      if (p.abierto) marker.togglePopup();
    });

    map.on('load', () => {
      map.addSource('zona-santiago', {
        type: 'geojson',
        data: {
          type: 'Feature',
          geometry: {
            type: 'Polygon',
            coordinates: [[
              [-105.52, 21.62], [-105.32, 21.60], [-105.12, 21.68],
              [-105.00, 21.82], [-105.06, 21.98], [-105.28, 22.02],
              [-105.48, 21.92], [-105.55, 21.76], [-105.52, 21.62]
            ]]
          }
        }
      });

      map.addLayer({
        id: 'luz-soleada-halo',
        type: 'line',
        source: 'zona-santiago',
        paint: {
          'line-color': '#FFD166',
          'line-width': 32,
          'line-blur': 24,
          'line-opacity': 0,
          'line-opacity-transition': { duration: 400 }
        }
      });

      map.addLayer({
        id: 'luz-soleada-relleno',
        type: 'fill',
        source: 'zona-santiago',
        paint: {
          'fill-color': '#FFE066',
          'fill-opacity': 0,
          'fill-opacity-transition': { duration: 900 }
        }
      });

      map.addLayer({
        id: 'borde-zona',
        type: 'line',
        source: 'zona-santiago',
        paint: {
          'line-color': '#FFF3B0',
          'line-width': 3.5,
          'line-opacity': 0,
          'line-opacity-transition': { duration: 400 }
        }
      });

      mapaListo = true;
      activarModo('generales');
    });

    const datos = {
      generales: {
        titulo: '📍 1. Datos Generales del Municipio',
        foto: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80',
        items: [
          '<b>Nombre del municipio:</b> Santiago Ixcuintla, Nayarit.',
          '<b>Ubicación (coordenadas):</b> Región Costa Norte de Nayarit; entre los paralelos 21°35\' y 22°05\' de latitud norte, y meridianos 104°57\' y 105°36\' de longitud oeste.',
          '<b>Significado del nombre:</b> <i>Santiago</i> en honor al Apóstol Santiago; <i>Ixcuintla</i> proviene del náhuatl <i>Itzcuintlan</i> ("lugar donde abundan los perros" o xoloitzcuintles).',
          '<b>Colindancias:</b> Al norte con Tuxpan y Ruiz; al este con El Nayar y Tepic; al sur con San Blas; y al oeste con el Océano Pacífico.',
          '<b>Superficie territorial:</b> 1,723.7 km² (aprox. 6.2% del territorio estatal).'
        ]
      },
      fisico: {
        titulo: '☀️ 2. Medio Físico, Relieve y Clima',
        foto: 'https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=800&q=80',
        items: [
          '<b>1. Relieve predominante:</b> Llanura costera aluvial plana y muy fértil (más del 85% del municipio), con lomeríos suaves hacia el oriente.',
          '<b>2. Ríos y cuerpos de agua:</b> Río Grande de Santiago, Río San Pedro Mezquital, lagunas costeras, esteros (Camichín, Mezcaltitán) y Marismas Nacionales.',
          '<b>3. Vegetación y clima:</b> Clima cálido subhúmedo con lluvias en verano (temp. media 26 °C); vegetación de manglar en costa, selva baja caducifolia y zonas agrícolas.',
          '<b>4. Planicies y elevaciones:</b> Amplia planicie costera del Pacífico y estribaciones bajas de la Sierra Madre Occidental al este (cerros como El Coastecomate).',
          '<b>5. Fauna y flora:</b> Flora: mangle rojo/blanco, ceiba, guanacaste, palma de coco. Fauna: cocodrilo de río, garzas, pelícanos, jaguarundi, venado cola blanca, camarón y ostión.'
        ]
      },
      poblacion: {
        titulo: '👥 3. Población y Dinámica Social',
        foto: 'https://images.unsplash.com/photo-1518105779142-d975f22f1b0a?auto=format&fit=crop&w=800&q=80',
        items: [
          '<b>1. Habitantes totales:</b> 93,981 habitantes (Censo INEGI 2020).',
          '<b>2. Hombres y mujeres:</b> Aproximadamente 47,280 hombres (50.3%) y 46,701 mujeres (49.7%).',
          '<b>3. Localidad más poblada:</b> La cabecera municipal, Santiago Ixcuintla (con más de 19,000 habitantes), seguida de Villa Hidalgo y Yago.',
          '<b>4. Nivel de escolaridad:</b> Grado promedio de escolaridad de 8.6 años (equivalente a segundo/tercer grado de secundaria concluido).',
          '<b>5. Principales problemáticas:</b> Vulnerabilidad a inundaciones por desbordamiento de ríos y huracanes, migración juvenil en busca de empleo, contaminación de esteros y falta de industrialización local.'
        ]
      },
      economia: {
        titulo: '🌾 4. Actividades Económicas y Turismo',
        foto: 'https://images.unsplash.com/photo-1590523277543-a94d2e4eb00b?auto=format&fit=crop&w=800&q=80',
        items: [
          '<b>1. Actividades principales:</b> Agricultura comercial, pesca ribereña y acuacultura, ganadería bovina, comercio y turismo ecológico/de playa.',
          '<b>2. Productos y servicios destacados:</b> Líder nacional en tabaco; gran productor de frijol, sorgo, maíz, mango, jitomate, además de camarón, ostión y pescado.',
          '<b>3. Principales atractivos turísticos:</b> Isla de Mexcaltitán (Pueblo Mágico), Playa Los Corchos, Boca de Camichín, Playa El Sesteo y recorridos por manglares.'
        ]
      },
      cultura: {
        titulo: '🎭 5. Cultura, Tradiciones e Historia',
        foto: 'https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3?auto=format&fit=crop&w=800&q=80',
        items: [
          '<b>1. Tradiciones y festividades:</b> Feria Nacional de Primavera (mayo), fiestas patronales de San Pedro y San Pablo en Mexcaltitán (29 de junio, con regata de canoas), gastronomía a base de mariscos (pescado zarandeado, ceviche, tlaxtihuilli).',
          '<b>2. Lugares históricos y naturales importantes:</b> Isla de Mexcaltitán (considerada cuna mítica de Aztlán), Templo del Señor de la Ascensión, el malecón del Río Santiago y la Reserva de la Biosfera Marismas Nacionales.'
        ]
      },
      reflexion: {
        titulo: '💡 6. Identidad y Relación con el Entorno',
        foto: 'https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=80',
        items: [
          '<b>1. ¿Qué hace especial a Santiago Ixcuintla?:</b> Su riqueza hídrica y cultural única, conocida como <i>"La Costa de Oro"</i>, al albergar a la mítica Isla de Mexcaltitán y ser el corazón agrícola y pesquero del norte de Nayarit.',
          '<b>2. Relación entre naturaleza y actividades:</b> Sus suelos planos y fértiles regados por el Río Santiago permiten una agricultura altamente productiva, mientras que su litoral, esteros y manglares sostienen la pesca de camarón y ostión, moldeando tanto la economía como la gastronomía y festividades de su gente.'
        ]
      }
    };

    function setOpacidadSegura(capaId, prop, valor) {
      if (mapaListo && map.getLayer(capaId)) {
        map.setPaintProperty(capaId, prop, valor);
      }
    }

    function actualizarCielo(soleado) {
      if (!mapaListo) return;
      if (soleado) {
        map.setSky({
          'sky-color': '#F77F00',
          'sky-horizon-blend': 0.55,
          'horizon-color': '#FFD166',
          'horizon-fog-blend': 0.75,
          'fog-color': '#FCBF49',
          'fog-ground-blend': 0.35
        });
      } else {
        map.setSky({
          'sky-color': '#0B397A',
          'sky-horizon-blend': 0.5,
          'horizon-color': '#7CC6FE',
          'horizon-fog-blend': 0.7,
          'fog-color': '#061A40',
          'fog-ground-blend': 0.4
        });
      }
    }

    function detenerAnimaciones() {
      if (animacionSolTimer) {
        clearInterval(animacionSolTimer);
        animacionSolTimer = null;
      }
    }

    /* Pulso solar suave usando transiciones nativas de GPU en vez de saturar 60fps */
    function animarPulsoSolar() {
      let alto = true;
      setOpacidadSegura('luz-soleada-relleno', 'fill-opacity', 0.30);
      animacionSolTimer = setInterval(() => {
        alto = !alto;
        setOpacidadSegura('luz-soleada-relleno', 'fill-opacity', alto ? 0.32 : 0.16);
      }, 1000);
    }

    function activarModo(modo) {
      detenerAnimaciones();
      document.querySelectorAll('.btn-capa').forEach(b => b.classList.remove('activo'));

      const tarjeta = document.getElementById('tarjetaInfo');
      const contenedorSol = document.getElementById('contenedorSol');
      const atmosferaSolar = document.getElementById('atmosferaSolar');

      setOpacidadSegura('luz-soleada-relleno', 'fill-opacity', 0);
      setOpacidadSegura('luz-soleada-halo', 'line-opacity', 0);
      setOpacidadSegura('borde-zona', 'line-opacity', 0);

      contenedorSol.style.display = 'none';
      atmosferaSolar.classList.remove('activa');
      actualizarCielo(false);

      if (modo === 'reset') {
        tarjeta.style.display = 'none';
        map.flyTo({ center: CENTRO_SANTIAGO, zoom: 12.2, pitch: 64, bearing: -15, duration: 1400 });
        return;
      }

      document.getElementById('btn-' + modo).classList.add('activo');

      if (modo === 'generales') {
        map.flyTo({ center: CENTRO_SANTIAGO, zoom: 12.8, pitch: 66, bearing: -10, duration: 1400 });
      } else if (modo === 'fisico') {
        contenedorSol.style.display = 'flex';
        atmosferaSolar.classList.add('activa');
        actualizarCielo(true);
        setOpacidadSegura('luz-soleada-halo', 'line-opacity', 0.9);
        setOpacidadSegura('borde-zona', 'line-opacity', 0.98);
        animarPulsoSolar();
        map.flyTo({ center: [-105.14, 21.84], zoom: 11.1, pitch: 72, bearing: 68, duration: 1500 });
      } else if (modo === 'poblacion') {
        map.flyTo({ center: [-105.2083, 21.8125], zoom: 13.7, pitch: 68, bearing: 25, duration: 1400 });
      } else if (modo === 'economia') {
        map.flyTo({ center: [-105.43, 21.74], zoom: 11.8, pitch: 68, bearing: -30, duration: 1500 });
      } else if (modo === 'cultura') {
        map.flyTo({ center: [-105.475, 21.905], zoom: 13.4, pitch: 68, bearing: -15, duration: 1500 });
      } else if (modo === 'reflexion') {
        map.flyTo({ center: [-105.32, 21.82], zoom: 11.3, pitch: 66, bearing: 10, duration: 1500 });
      }

      document.getElementById('infoFoto').src = datos[modo].foto;
      document.getElementById('infoTitulo').innerHTML = datos[modo].titulo;
      document.getElementById('infoLista').innerHTML = datos[modo].items.map(i => `<li>${i}</li>`).join('');
      tarjeta.scrollTop = 0;
      tarjeta.style.display = 'block';
    }
  </script>
</body>
</html>
